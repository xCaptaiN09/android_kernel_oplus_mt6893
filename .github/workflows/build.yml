name: Build Kernel

on:
  push:
    branches:
      - sukisu-4.19
      - ksu-next-4.19
      - KSUN-susfs-manual-hook-mglru
      - KSUN-RUI-susfs-manual-hook-mglru
      - fix/selinux-attr-current-probe-hide
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      FLASHABLE_ZIP: KSU-Next-AOSP.zip
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential curl flex gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi git gnupg gperf libncurses5-dev libssl-dev python3 unzip zip zlib1g-dev
        sudo apt-get install -y python2 || true

    - name: Set up Proton Clang
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchain
        git clone --depth=1 https://github.com/kdrag0n/proton-clang.git $GITHUB_WORKSPACE/toolchain/proton-clang

    - name: Build Kernel
      env:
        TOOLCHAIN: ${{ github.workspace }}/toolchain/proton-clang
      run: |
        bash build_kernel.sh

    - name: Print build log on failure
      if: failure()
      run: |
        if [ -f build.log ]; then
          grep -m 30 -E "error:|fatal error:" build.log || true
          tail -100 build.log
        fi

    - name: Upload Image.gz-dtb
      uses: actions/upload-artifact@v7
      with:
        name: Image.gz-dtb
        path: out/arch/arm64/boot/Image.gz-dtb
        if-no-files-found: error

    - name: Create AnyKernel3 ZIP
      run: |
        test -s out/arch/arm64/boot/Image.gz-dtb
        git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
        cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
        cp anykernel_template.sh AnyKernel3/anykernel.sh
        (
          cd AnyKernel3
          zip -r9 "../$FLASHABLE_ZIP" *
        )
        unzip -tq "$FLASHABLE_ZIP"

    - name: Upload Flashable ZIP
      uses: actions/upload-artifact@v7
      with:
        path: ${{ env.FLASHABLE_ZIP }}
        archive: false
        if-no-files-found: error
